<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gravitas-cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00c8e6" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer White Orbit Ellipse - Top Arc -->
  <path d="M 110,360 C 50,280 80,180 200,130 C 330,75 560,80 730,140 C 820,175 870,225 870,230 C 865,235 830,195 720,152 C 550,95 330,92 210,145 C 95,195 70,285 110,360 Z" fill="#ffffff" />

  <!-- Outer White Orbit Ellipse - Bottom Arc -->
  <path d="M 790,170 C 850,250 820,350 700,400 C 570,455 340,450 170,390 C 80,355 30,305 30,300 C 35,295 70,335 180,378 C 350,435 570,438 690,385 C 805,335 830,245 790,170 Z" fill="#ffffff" />

  <!-- LEFT SIDE: Three Input Rays with Icons -->
  <!-- Ray 1 (Top) -->
  <line x1="90" y1="225" x2="285" y2="225" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <polyline points="275,217 285,225 275,233" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Rocket on Ray 1 -->
  <g transform="translate(155, 208) scale(0.95)">
    <!-- Rocket Body -->
    <path d="M 5,17 C 12,12 24,12 35,17 C 24,22 12,22 5,17 Z" fill="#00f0ff" filter="url(#glow)" />
    <path d="M 30,14 Q 45,17 30,20 Z" fill="#ffffff" />
    <circle cx="24" cy="17" r="2.5" fill="#050814" />
    <!-- Fins -->
    <path d="M 8,14 L 3,8 L 12,13 Z" fill="#00d4e6" />
    <path d="M 8,20 L 3,26 L 12,21 Z" fill="#00d4e6" />
    <!-- Exhaust flame -->
    <path d="M 3,17 L -4,15 L -2,17 L -4,19 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Ray 2 (Middle) -->
  <line x1="90" y1="265" x2="285" y2="265" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <polyline points="275,257 285,265 275,273" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Sine Wave on Ray 2 -->
  <path d="M 115,265 Q 127,245 139,265 T 163,265 T 187,265 T 211,265 T 235,265" fill="none" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Ray 3 (Bottom) -->
  <line x1="90" y1="305" x2="285" y2="305" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <polyline points="275,297 285,305 275,313" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Atom / Molecule & Lightning on Ray 3 -->
  <g transform="translate(140, 290)">
    <!-- Bonds -->
    <line x1="35" y1="15" x2="15" y2="32" stroke="#00f0ff" stroke-width="3" />
    <line x1="35" y1="15" x2="50" y2="35" stroke="#00f0ff" stroke-width="3" />
    <line x1="15" y1="32" x2="25" y2="45" stroke="#00f0ff" stroke-width="3" />
    <!-- Atom circles -->
    <circle cx="35" cy="15" r="7" fill="#00f0ff" filter="url(#glow)" />
    <circle cx="15" cy="32" r="6" fill="#00f0ff" filter="url(#glow)" />
    <circle cx="50" cy="35" r="5" fill="#00f0ff" filter="url(#glow)" />
    <circle cx="25" cy="45" r="4" fill="#00f0ff" filter="url(#glow)" />
    <!-- Lightning bolt -->
    <polygon points="32,22 28,30 33,30 29,38 37,28 32,28" fill="#ffffff" />
  </g>

  <!-- CENTER: Bi-Convex Optical Lens (White Outline) -->
  <path d="M 300,165 C 265,215 265,315 300,365 C 335,315 335,215 300,165 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />

  <!-- Refracted Cyan Rays through Lens converging right -->
  <line x1="300" y1="225" x2="405" y2="265" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="305" y1="265" x2="405" y2="265" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />
  <line x1="300" y1="305" x2="405" y2="265" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- RIGHT SIDE: Audio Spectrum / Waveform in Cyan/Teal -->
  <g opacity="0.85" filter="url(#glow)">
    <line x1="410" y1="255" x2="410" y2="275" stroke="#00d4e6" stroke-width="3.5" stroke-linecap="round" />
    <line x1="422" y1="245" x2="422" y2="285" stroke="#00d4e6" stroke-width="3.5" stroke-linecap="round" />
    <line x1="434" y1="235" x2="434" y2="295" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="446" y1="250" x2="446" y2="280" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="458" y1="240" x2="458" y2="290" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="470" y1="220" x2="470" y2="310" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="482" y1="245" x2="482" y2="285" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="494" y1="230" x2="494" y2="300" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="506" y1="240" x2="506" y2="290" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="518" y1="215" x2="518" y2="315" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="530" y1="245" x2="530" y2="285" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="542" y1="225" x2="542" y2="305" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="554" y1="235" x2="554" y2="295" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="566" y1="210" x2="566" y2="320" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="578" y1="240" x2="578" y2="290" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="590" y1="220" x2="590" y2="310" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="602" y1="235" x2="602" y2="295" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="614" y1="215" x2="614" y2="315" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="626" y1="245" x2="626" y2="285" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="638" y1="230" x2="638" y2="300" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="650" y1="210" x2="650" y2="320" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="662" y1="235" x2="662" y2="295" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="674" y1="220" x2="674" y2="310" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="686" y1="240" x2="686" y2="290" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="698" y1="230" x2="698" y2="300" stroke="#00d4e6" stroke-width="3.5" stroke-linecap="round" />
    <line x1="710" y1="245" x2="710" y2="285" stroke="#00d4e6" stroke-width="3.5" stroke-linecap="round" />
    <line x1="722" y1="255" x2="722" y2="275" stroke="#00c8e6" stroke-width="3.5" stroke-linecap="round" />
    <line x1="734" y1="260" x2="734" y2="270" stroke="#00c8e6" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- TEXT: G.R.A.V.I.T.A.S. -->
  <text x="585" y="273" font-family="'Space Grotesk', 'Courier New', monospace" font-size="34" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="7" filter="url(#glow)">G.R.A.V.I.T.A.S.</text>

  <!-- SUBTEXT: K.J SOMAIYA SCHOOL OF ENGINEERING -->
  <text x="585" y="310" font-family="'Space Grotesk', sans-serif" font-size="14.5" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="4">K.J SOMAIYA SCHOOL OF ENGINEERING</text>
</svg>